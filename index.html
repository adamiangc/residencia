    function updateStatus(color, texto) {
        const dot = document.getElementById("statusDot");

   async function probarIP(ip) {
    try {
        console.log(`🔍 Probando IP: ${ip}`);
        const ctrl = new AbortController();
        const tid = setTimeout(() => {
            console.log(`⏰ Timeout para ${ip}`);
            ctrl.abort();
        }, 1200);
        
        const r = await fetch(`http://${ip}:9888/api/ping`, { signal: ctrl.signal, mode: 'cors' });
        clearTimeout(tid);
        
        console.log(`📡 Respuesta de ${ip}: ${r.status} ${r.statusText}`);
        
        if (r.ok) {
            const json = await r.json();
            console.log(`✅ Datos de ${ip}:`, json);
            if (json.ok) return ip;
        } else {
            console.log(`❌ ${ip} respondió pero no ok`);
        }
    } catch(e) {
        console.log(`❌ Error en ${ip}:`, e.message);
    }
    return null;
}

    async function autoDescubrirPC() {
        if (autoDescubriendoIP) return;
        autoDescubriendoIP = true;
        updateStatus('yellow', 'Buscando PC en la red...');

        if (SYNC_URL) {
            const ipGuardada = SYNC_URL.replace("http://", "").split(":")[0];
            const ok = await probarIP(ipGuardada);
            if (ok) {
                autoDescubriendoIP = false;
                updateStatus('green', `PC encontrado (${ok})`);
                return true;
            }
        }

        for (const h of ["127.0.0.1", "localhost"]) {
            const ok = await probarIP(h);
            if (ok) {
                SYNC_URL = `http://${ok}:9888`;
                localStorage.setItem("last_pc_ip", SYNC_URL);
                autoDescubriendoIP = false;
                updateStatus('green', `PC encontrado (${ok})`);
                return true;
            }
        }

        const prefijos = ["192.168.0", "192.168.1", "192.168.2", "10.0.0", "172.16.0"];
        for (const prefijo of prefijos) {
            for (let inicio = 1; inicio <= 254; inicio += 20) {
                const lote = [];
                for (let i = inicio; i < inicio + 20 && i <= 254; i++) {
                    lote.push(probarIP(`${prefijo}.${i}`));
                }
                const resultados = await Promise.all(lote);
                const encontrada = resultados.find(r => r !== null);
                if (encontrada) {
                    SYNC_URL = `http://${encontrada}:9888`;
                    localStorage.setItem("last_pc_ip", SYNC_URL);
                    autoDescubriendoIP = false;
                    updateStatus('green', `PC encontrado (${encontrada})`);
                    return true;
                }
            }
        }

        autoDescubriendoIP = false;
        updateStatus('red', 'PC no encontrado en red');
        return false;
    }

    async function configurarIP() {
        const actual = SYNC_URL ? SYNC_URL.replace("http://", "").split(":")[0] : "";
        const nuevaIP = prompt("IP DEL PC (Ej: 192.168.0.150) o deja vaco para bsqueda automtica:", actual);
        if (nuevaIP === null) return;
        if (nuevaIP.trim() === "") {
            await autoDescubrirPC();
            if (SYNC_URL) sincronizarConEscritorio();
        } else {
            SYNC_URL = `http://${nuevaIP.trim()}:9888`;
            localStorage.setItem("last_pc_ip", SYNC_URL);
            updateStatus('gray', `IP configurada`);
            sincronizarConEscritorio();
        }
    }

    async function inicializarSincronizacion() {

            updateStatus('gray', 'Conectando con PC...');
            setTimeout(() => sincronizarConEscritorio(), 800);
        } else {
            setTimeout(async () => {
                const ok = await autoDescubrirPC();
                if (ok) sincronizarConEscritorio();
            }, 1000);
        }
    }

    function showToast(msg, tipo = 'info') {
        document.querySelectorAll('.toast').forEach(t => t.remove());
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        if (tipo === 'error') toast.style.backgroundColor = '#dc2626';
        else if (tipo === 'success') toast.style.backgroundColor = '#10b981';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

        document.getElementById("totalRep").innerText = repuestos.length;
        document.getElementById("totalRecordatorios").innerText = recordatorios.length;

    function getNombreUbicacion(id) { let u = ubicaciones.find(u=>u.id===id); return u ? u.nombre : "?"; }
    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}) : ''; }
    function hoyStr() { return new Date().toISOString().slice(0,10); }
    function estaAtrasado(m) { return (!m.completado && m.fecha < hoyStr()); }

        let filtrados = mantenimientos.filter(m => {
            if (filtroUbicacion !== "todos" && m.ubicacionId != filtroUbicacion) return false;
            if (fechaDesde && m.fecha < fechaDesde) return false;
            if (fechaHasta && m.fecha > fechaHasta) return false;
            if (textoBusqueda && !(m.descripcion || "").toLowerCase().includes(textoBusqueda.toLowerCase()) && !(m.tecnico || "").toLowerCase().includes(textoBusqueda.toLowerCase())) return false;
            return true;
        }).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
        if(!filtrados.length) html += `<tr><td colspan="8" class="text-center p-4">No hay registros</td></tr>`;
        filtrados.forEach(m => { let atrasado=estaAtrasado(m); html+=`<tr class="${m.completado?'completado':(atrasado?'bg-red-50':(m.urgente?'urgente':''))}"><td class="p-2">${m.fecha}</td><td class="p-2">${escapeHtml(getNombreUbicacion(m.ubicacionId))}</td><td class="p-2">${escapeHtml(m.categoria || m.tipo)}</td><td class="p-2">${escapeHtml(m.descripcion.substring(0,50))}${m.descripcion.length>50?'...':''}</td><td class="p-2">${escapeHtml(m.tecnico)}</td><td class="p-2">${m.urgente?'':'-'}</td><td class="p-2">${m.completado?'✅':(atrasado?'':'-')}</td>

        html+=`</tbody></table></div>`;
        document.getElementById("panelMantenimientos").innerHTML = html;
        document.getElementById("filtroUbicSelect").value = filtroUbicacion;
        document.getElementById("fechaDesde").value = fechaDesde;
        document.getElementById("fechaHasta").value = fechaHasta;

        document.getElementById("fechaDesde").onchange = e => { fechaDesde = e.target.value; renderMantenimientos(); };
        document.getElementById("fechaHasta").onchange = e => { fechaHasta = e.target.value; renderMantenimientos(); };
        document.getElementById("buscadorTexto").oninput = e => { textoBusqueda = e.target.value; renderMantenimientos(); };

        document.querySelectorAll(".verDetalleMant").forEach(btn=>btn.onclick=()=>verDetalleMantenimiento(parseInt(btn.dataset.id)));
        document.querySelectorAll(".editarMant").forEach(btn=>btn.onclick=()=>mostrarModalMantenimiento(parseInt(btn.dataset.id)));
        document.querySelectorAll(".eliminarMant").forEach(btn=>btn.onclick=()=>eliminarMantenimiento(parseInt(btn.dataset.id)));
    }

    function exportarCSV(mantArray) {
        let csv = "Fecha,Ubicacin,Tipo,Descripcin,Tcnico,Urgente,Completado,Atrasado\n" + mantArray.map(m => `${m.fecha},${getNombreUbicacion(m.ubicacionId)},${m.tipo},"${m.descripcion}",${m.tecnico},${m.urgente?"S":"No"},${m.completado?"S":"No"},${estaAtrasado(m)?"S":"No"}`).join("\n");
        let a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
        a.download = "mantenimientos.csv";
        a.click();
        showToast("CSV exportado", "success");
    }

    function marcarCompletado(id){ 
        let m = mantenimientos.find(m => m.id === id); 
        if(m && !m.completado){ 
            m.completado = true; 
            m.estado = "Finalizado";
            if (m.recordatorioId > 0) {
                let rec = recordatorios.find(r => r.id === m.recordatorioId);
                if (rec && rec.periodicidad !== "nico") {
                    let f = new Date(rec.fecha);
                    if (rec.periodicidad === "Por horas") f.setHours(f.getHours() + 1);
                    else if (rec.periodicidad === "Diario") f.setDate(f.getDate() + 1);
                    else if (rec.periodicidad === "Mensual") f.setMonth(f.getMonth() + 1);
                    else if (rec.periodicidad === "Trimestral") f.setMonth(f.getMonth() + 3);
                    else if (rec.periodicidad === "Anual") f.setFullYear(f.getFullYear() + 1);
                    
                    let nuevaF = f.toISOString().substring(0,16).replace('T',' ');
                    rec.fecha = nuevaF;
                    
                    let mid = mantenimientos.length ? Math.max(...mantenimientos.map(mx=>mx.id)) + 1 : 1;
                    mantenimientos.push({
                        id: mid, fecha: nuevaF, fechaProgramada: nuevaF, ubicacionId: rec.ubicacionId,
                        tipo: "Preventivo", descripcion: `[PLANIFICACIN ${rec.periodicidad.toUpperCase()}] ${rec.descripcion}`,
                        tecnico: "No asignado", estado: "Programado", recordatorioId: rec.id, urgente: false, completado: false
                    });
                    showToast("✅ Tarea finalizada y siguiente planificada", "success");
                } else { showToast("Marcado como completado","success"); }
            } else { showToast("Marcado como completado","success"); }
            guardarTodo(); renderMantenimientos(); renderCalendario(); 
        } 
    }

    function renderRecordatorios(){
        let html = `<div class="flex justify-between items-center mb-3"><h2 class="text-xl font-semibold"> Recordatorios preventivos</h2><button id="btnNuevoRecord" class="bg-purple-600 text-white px-3 py-1 rounded-xl text-sm"><i class="fas fa-plus"></i> Nuevo recordatorio</button></div>

        document.querySelectorAll(".eliminarRecordBtn").forEach(btn=>btn.onclick=()=>{ let id=parseInt(btn.dataset.id); if(confirm("Eliminar este recordatorio?")){ recordatorios=recordatorios.filter(r=>r.id!==id); mantenimientos=mantenimientos.filter(m=>m.recordatorioId!==id || m.completado); guardarTodo(); renderRecordatorios(); actualizarContadores(); } });
    }

    function mostrarModalRecordatorio(editId=null){
        let ubicacionesOptions = ubicaciones.map(u=>`<option value="${u.id}">${escapeHtml(u.nombre)}</option>`).join('');
        let hoyD = hoyStr(), hoyH = new Date().toTimeString().substring(0,5);
        let datalistHtml = `<datalist id="tiposRecLista"><option>General</option><option>Fontanera</option><option>Electricidad</option><option>Climatizacin</option><option>Carpintera</option><option>Pintura</option><option>Limpieza</option><option>Jardinería</option><option>Ascensores</option><option>Otros</option></datalist>`;
        let contenido = `<div class="mb-3"><label class="font-bold">Ubicacin *</label><select id="formUbicRec" class="w-full border rounded p-2">${ubicacionesOptions}</select></div>
        <div class="grid grid-cols-2 gap-2 mb-3"><div><label class="font-bold">Fecha *</label><input type="date" id="formFechaRec" class="w-full border rounded p-2" value="${hoyD}"></div><div><label class="font-bold">Hora</label><input type="time" id="formHoraRec" class="w-full border rounded p-2" value="${hoyH}"></div></div>
        <div class="mb-3"><label class="font-bold">Tipo *</label><input list="tiposRecLista" id="formTipoRec" class="w-full border rounded p-2" placeholder="Ej: Fontanera">${datalistHtml}</div>
        <div class="mb-3"><label class="font-bold">Periodicidad</label><select id="formPeriodicidad" class="w-full border rounded p-2"><option>nico</option><option>Por horas</option><option>Diario</option><option>Mensual</option><option>Trimestral</option><option>Anual</option></select></div>
        <div class="mb-3"><label class="font-bold">Descripcin</label><textarea id="formDescRec" rows="2" class="w-full border rounded p-2" placeholder="Describa el trabajo preventivo"></textarea></div>`;
        if(editId){
            let r = recordatorios.find(r=>r.id===editId);
            if(r) {
                let fParts = r.fecha.split(' ');
                let fD = fParts[0] || hoyD, fH = fParts[1] ? fParts[1].substring(0,5) : hoyH;
                contenido = `<div class="mb-3"><label class="font-bold">Ubicacin *</label><select id="formUbicRec" class="w-full border rounded p-2">${ubicacionesOptions}</select></div>
                <div class="grid grid-cols-2 gap-2 mb-3"><div><label class="font-bold">Fecha *</label><input type="date" id="formFechaRec" class="w-full border rounded p-2" value="${fD}"></div><div><label class="font-bold">Hora</label><input type="time" id="formHoraRec" class="w-full border rounded p-2" value="${fH}"></div></div>
                <div class="mb-3"><label class="font-bold">Tipo *</label><input list="tiposRecLista" id="formTipoRec" class="w-full border rounded p-2" value="${escapeHtml(r.tipo)}">${datalistHtml}</div>
                <div class="mb-3"><label class="font-bold">Periodicidad</label><select id="formPeriodicidad" class="w-full border rounded p-2"><option ${r.periodicidad==='nico'?'selected':''}>nico</option><option ${r.periodicidad==='Por horas'?'selected':''}>Por horas</option><option ${r.periodicidad==='Diario'?'selected':''}>Diario</option><option ${r.periodicidad==='Mensual'?'selected':''}>Mensual</option><option ${r.periodicidad==='Trimestral'?'selected':''}>Trimestral</option><option ${r.periodicidad==='Anual'?'selected':''}>Anual</option></select></div>
                <div class="mb-3"><label class="font-bold">Descripcin</label><textarea id="formDescRec" rows="2" class="w-full border rounded p-2">${escapeHtml(r.descripcion)}</textarea></div>`;
            }
        }
        abrirModal(editId ? "✏️ Editar Recordatorio" : "➕ Nuevo Recordatorio", contenido, () => {
            let ubicId = parseInt(document.getElementById("formUbicRec").value);
            let fD = document.getElementById("formFechaRec").value;
            let fH = document.getElementById("formHoraRec").value || "00:00";
            let fechaHora = `${fD} ${fH}`;
            let tipo = document.getElementById("formTipoRec").value.trim();
            let periodicidad = document.getElementById("formPeriodicidad").value;
            let desc = document.getElementById("formDescRec").value.trim();
            if(!ubicId || !fD || !tipo){ showToast("Complete campos obligatorios","error"); return; }
            if(editId){
                let idx = recordatorios.findIndex(r=>r.id===editId);
                if(idx!==-1) recordatorios[idx] = {...recordatorios[idx], fecha:fechaHora, ubicacionId:ubicId, tipo, periodicidad, descripcion:desc};
                let idxM = mantenimientos.findIndex(m => m.recordatorioId === editId && !m.completado);
                if(idxM !== -1) { mantenimientos[idxM].fecha = fechaHora; mantenimientos[idxM].fechaProgramada = fechaHora; mantenimientos[idxM].descripcion = `[PLANIFICACIN ${periodicidad.toUpperCase()}] ${desc}`; }
                guardarTodo(); showToast("Recordatorio y planificacin actualizados","success");
            } else {
                let nid = recordatorios.length ? Math.max(...recordatorios.map(r=>r.id)) + 1 : 1;
                recordatorios.push({id:nid, fecha:fechaHora, ubicacionId:ubicId, tipo, periodicidad, descripcion:desc});
                let mid = mantenimientos.length ? Math.max(...mantenimientos.map(m=>m.id)) + 1 : 1;
                mantenimientos.push({id: mid, fecha: fechaHora, fechaProgramada: fechaHora, ubicacionId: ubicId, tipo: "Preventivo", descripcion: `[PLANIFICACIN ${periodicidad.toUpperCase()}] ${desc}`, tecnico: "No asignado", estado: "Programado", recordatorioId: nid, urgente: false, completado: false});
                guardarTodo(); showToast("Recordatorio y orden programada creados","success");
            }
            actualizarContadores(); renderRecordatorios(); renderMantenimientos(); renderCalendario();
        });
        if(editId){ let r=recordatorios.find(r=>r.id===editId); if(r) setTimeout(()=>{ document.getElementById("formUbicRec").value = r.ubicacionId; },10); }
    }

    // ========== 5. CALENDARIO ==========
    let fechaCalendario = new Date();
    const mesesCal = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    function renderCalendario(){
        let anio=fechaCalendario.getFullYear(), mes=fechaCalendario.getMonth();
        let primerDia=new Date(anio,mes,1), ultimoDia=new Date(anio,mes+1,0), diasEnMes=ultimoDia.getDate(), diaInicio=primerDia.getDay();
        let hoy = hoyStr();
        let startDay = (diaInicio === 0) ? 6 : diaInicio - 1;
        let html=`<div class="flex justify-between items-center mb-4 flex-wrap gap-2">
            <div class="flex gap-2"><button id="mesAnt" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg transition"><i class="fas fa-chevron-left"></i> Anterior</button>
            <button id="mesSig" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg transition">Siguiente <i class="fas fa-chevron-right"></i></button></div>
            <h2 class="text-xl font-bold">${mesesCal[mes]} ${anio}</h2><div></div></div>
        <div class="flex flex-wrap gap-4 mb-4 p-3 bg-gray-50 rounded-lg text-sm border">
            <div class="flex items-center gap-2"><div class="w-5 h-5 bg-green-500 rounded"></div><span> Mantenimiento normal</span></div>
            <div class="flex items-center gap-2"><div class="w-5 h-5 bg-orange-500 rounded"></div><span> Recordatorio</span></div>
            <div class="flex items-center gap-2"><div class="w-5 h-5 bg-gradient-to-r from-green-500 to-orange-500 rounded"></div><span>+ Ambos</span></div>
            <div class="flex items-center gap-2"><div class="w-5 h-5 bg-red-500 rounded"></div><span> Mantenimiento atrasado</span></div>
            <div class="flex items-center gap-2"><div class="w-5 h-5 bg-blue-500 rounded"></div><span> Hoy</span></div>
        </div>
        <div class="grid grid-cols-7 gap-1 mb-2 text-center font-bold">
            <div class="p-2 bg-gray-100 rounded-lg">L</div><div class="p-2 bg-gray-100 rounded-lg">M</div>
            <div class="p-2 bg-gray-100 rounded-lg">X</div><div class="p-2 bg-gray-100 rounded-lg">J</div><div class="p-2 bg-gray-100 rounded-lg">V</div><div class="p-2 bg-gray-100 rounded-lg">S</div><div class="p-2 bg-red-100 rounded-lg">D</div>
        </div>
        <div class="grid grid-cols-7 gap-1" id="calendarGrid">`;
        for(let i=0; i<startDay; i++) html+=`<div class="p-2 bg-gray-50 rounded-lg h-16"></div>`;
        for(let d=1;d<=diasEnMes;d++){
            let fechaStr=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            let mantDia=mantenimientos.filter(m=>m.fecha===fechaStr);
            let tieneAtrasado=mantDia.some(m=>!m.completado && m.fecha<hoy);
            let tieneFuturo=mantDia.some(m=>!m.completado && m.fecha>=hoy);
            let tieneRecord=recordatorios.some(r=>r.fecha===fechaStr);
            let clase="bg-gray-50 hover:bg-gray-100", iconos="", tooltip="";
            if(fechaStr===hoy) { clase="dia-actual text-white"; tooltip="Hoy"; }
            else if(tieneAtrasado && tieneRecord) { clase="dia-atrasado text-white"; iconos='⚠️'; tooltip="Mantenimiento atrasado + recordatorio"; }
            else if(tieneAtrasado) { clase="dia-atrasado text-white"; iconos='⚠️'; tooltip="Mantenimiento atrasado"; }
            else if(tieneFuturo && tieneRecord) { clase="dia-con-ambos text-white"; iconos='🔔'; tooltip="Mantenimiento futuro + recordatorio"; }
            else if(tieneFuturo) { clase="dia-con-mantenimiento text-white"; iconos=''; tooltip="Mantenimiento programado"; }
            else if(tieneRecord) { clase="dia-con-recordatorio text-white"; iconos='🔔'; tooltip="Recordatorio"; }
            html+=`<div class="calendario-dia p-2 rounded-lg text-center ${clase}" onclick="verEventosDiaGenerico('${fechaStr}')" title="${tooltip}"><span class="font-semibold">${d}</span><div class="text-xs mt-1">${iconos}</div></div>`;
        }
        html+=`</div><div id="eventosDiaDiv" class="mt-4 p-3 bg-gray-50 rounded-lg"><p class="text-gray-500 text-center"> Seleccione un da para ver sus eventos</p></div>`;
        document.getElementById("panelCalendario").innerHTML = html;
        document.getElementById("mesAnt").onclick = () => { fechaCalendario.setMonth(fechaCalendario.getMonth()-1); renderCalendario(); };
        document.getElementById("mesSig").onclick = () => { fechaCalendario.setMonth(fechaCalendario.getMonth()+1); renderCalendario(); };
    }

    function verEventosDiaGenerico(fechaStr){
        let mantDia=mantenimientos.filter(m=>m.fecha===fechaStr);
        let recordDia=recordatorios.filter(r=>r.fecha===fechaStr);
        let html=`<h3 class="font-bold mb-2 text-lg"> Eventos del ${fechaStr}</h3>`;
        mantDia.forEach(m=>{ let atrasado=estaAtrasado(m); html+=`<div class="evento-item p-3 rounded-lg mb-2 shadow-sm ${atrasado?'bg-red-50 border-red-500':(m.urgente?'bg-red-50 border-red-500':'bg-green-50 border-green-500')}" onclick="verDetalleMantenimiento(${m.id})"><strong>${m.urgente?'⚠️ ':''}${m.tipo}</strong> - ${getNombreUbicacion(m.ubicacionId)}<br><span class="text-sm mt-1 block">${m.descripcion.substring(0,60)}${m.descripcion.length>60?'...':''}</span><span class="text-xs text-gray-500 block mt-1"> ${m.tecnico}</span></div>`; });
        recordDia.forEach(r=>{ html+=`<div class="evento-item bg-orange-50 border-orange-500 p-3 rounded-lg mb-2 shadow-sm" onclick="alert('Recordatorio:\n${r.descripcion}')"><strong> ${r.tipo}</strong> - ${getNombreUbicacion(r.ubicacionId)}<br><span class="text-sm mt-1 block">${r.descripcion}</span></div>`; });
        if(!mantDia.length && !recordDia.length) html+=`<p class="text-gray-500 p-3 bg-white rounded-lg border text-center">No hay eventos este da</p>`;
        document.getElementById("eventosDiaDiv").innerHTML = html;
    }

    // ========== 6. ESTADSTICAS ==========
    let chartMensual, chartTipo;
    function renderEstadisticas(){
        let html = `<h2 class="text-xl font-semibold mb-3"> Estadsticas de mantenimiento</h2>

        <div><canvas id="graficoTipo"></canvas><p class="text-center text-sm font-bold mt-2">Distribucin por tipo</p></div></div>`;

        let labels=Object.keys(mesesObj).sort(); let data=labels.map(l=>mesesObj[l]);

        let tipos={}; mantenimientos.forEach(m=>{tipos[m.tipo]=(tipos[m.tipo]||0)+1;});
        const ctx2=document.getElementById("graficoTipo").getContext("2d");

        let colores = ['#f97316','#10b981','#8b5cf6','#ef4444','#f59e0b','#06b6d4','#ec4899'];
        chartTipo=new Chart(ctx2,{type:'pie',data:{labels:Object.keys(tipos),datasets:[{data:Object.values(tipos),backgroundColor:colores.slice(0,Object.keys(tipos).length)}]}});

let intervaloAutoSync = null;
let sincronizacionAutomaticaActiva = false;
let ultimoIntentoAutoSync = 0;

async function autoSyncCompleto() {
    if (sincronizando) return;
    if (!SYNC_URL) return;
    if (document.visibilityState !== 'visible') return;
    
    const ahora = Date.now();
    if (ahora - ultimoIntentoAutoSync < 5000) return;
    ultimoIntentoAutoSync = ahora;
    
    sincronizando = true;
    
    try {
        const payload = { 
            Ubicaciones: ubicaciones.map(u => ({ Nombre: u.nombre || "" })), 
            Mantenimientos: mantenimientos.map(m => ({
                Descripcion: m.descripcion || "",
                Ubicacion: getNombreUbicacion(m.ubicacionId),
                Fecha: m.fecha || new Date().toISOString().slice(0,10),
                Estado: m.completado ? "Finalizado" : m.estado || "Pendiente", 
                Urgente: m.urgente ? 1 : 0,
                Completado: m.completado ? 1 : 0,
                Tecnico: m.tecnico || "",
                Tipo: m.tipo || "General",
                Categoria: m.categoria || m.tipo || "General",
                RecordatorioId: m.recordatorioId || 0
            })), 
            Repuestos: repuestos.map(r => ({
                Codigo: r.codigo || "N/A",
                Nombre: r.nombre || "",
                Stock: r.stock || 0,
                Minimo: r.minimo || 0
            })), 
            Recordatorios: recordatorios.map(rec => ({
                Fecha: rec.fecha || "",
                Descripcion: rec.descripcion || "",
                Tipo: rec.tipo || "General",
                Periodicidad: rec.periodicidad || "Único",
                UbicacionId: parseInt(rec.ubicacionId) || 1,
                Activo: rec.completado ? 0 : 1
            })),
            PPCL: {
                Mes: datosPPCL.mes || "",
                PuntosTerminales: datosPPCL.tabla1.map(p => ({
                    Elemento: p.elemento || "", Fecha: p.fecha || "", TFria: p.tFria || "", 
                    TCal: p.tCal || "", Cloro: p.cloro || "", Estado: p.estado || "OK", 
                    Observaciones: p.observaciones || "", Firma: p.firma || ""
                })),
                AperturaSemanal: datosPPCL.tabla2.filas.map(f => ({
                    Semana: f.semana, Fecha: f.fecha, Observaciones: f.observaciones,
                    Medidas: f.medidas, PuntosAbiertos: f.puntosAbiertos, Firma: f.firma
                })),
                PurgaAcumulador: datosPPCL.tabla3.filas.map(f => ({
                    Semana: f.semana, Fecha: f.fecha, Observaciones: f.observaciones,
                    Medidas: f.medidas, Firma: f.firma
                })),
                Turbidez: datosPPCL.tabla4.filas.map(f => ({
                    Semana: f.semana, Fecha: f.fecha, Turbidez: f.turbidez,
                    Medidas: f.medidas, PuntoRevisado: f.puntoRevisado, Firma: f.firma
                })),
                CloroPh: datosPPCL.tabla5.map(f => ({
                    Fecha: f.fecha, Cloro: f.cloro, Ph: f.ph, Medidas: f.medidas, Firma: f.firma
                })),
                PurgaMensual: datosPPCL.tabla6.filas.map(f => ({
                    Fecha: f.fecha, Observaciones: f.observaciones, Medidas: f.medidas, Firma: f.firma
                })),
                DepositosAfch: datosPPCL.tabla7.filas.map(f => ({
                    Semana: f.semana, Fecha: f.fecha, Temperatura: f.temperatura,
                    Deposito: f.deposito, Medidas: f.medidas, Firma: f.firma
                })),
                AcumuladorRetorno: datosPPCL.tabla8.map(f => ({
                    Fecha: f.fecha, Acumulador: f.acumulador, Retorno: f.retorno,
                    Medidas: f.medidas, Firma: f.firma
                })),
                Incendios: datosPPCL.tabla9.filas.map(f => ({
                    Fecha: f.fecha, Temperatura: f.temperatura, Cloro: f.cloro,
                    Ph: f.ph, Medidas: f.medidas, Firma: f.firma
                }))
            }
        };

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);

        const response = await fetch(`${SYNC_URL}/api/datos`, { 
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);

        if (!response.ok) return;

        const datosPC = await response.json();
        if (!datosPC) return;

        const normalizar = (lista) => (lista?.$values || lista || []);
        
        ubicaciones = normalizar(datosPC.Ubicaciones || datosPC.ubicaciones).map(u => ({
            id: u.Id || u.id, nombre: u.Nombre || u.nombre
        }));

            recordatorioId: m.RecordatorioId || m.recordatorioId || 0,
            completado: (m.Estado === "Finalizado" || m.Estado === "Completado" || m.completado), 
            urgente: (m.Urgente === 1 || m.Urgente === true) ? true : false
        }));

        repuestos = normalizar(datosPC.Repuestos || datosPC.repuestos).map(r => ({
            id: r.Id || r.id,
            codigo: r.CodigoBarras || r.Codigo || r.codigo || "N/A",

            stock: r.Stock || r.stock || 0,
            minimo: r.Minimo || r.minimo || 0,
            ubicacionId: 0
        }));

        recordatorios = normalizar(datosPC.Recordatorios || datosPC.recordatorios).map(rec => ({
            id: rec.Id || rec.id,
            ubicacionId: rec.UbicacionId || rec.ubicacionId || 1,
            fecha: rec.FechaProxima || rec.Fecha || "",
            descripcion: rec.Descripcion || rec.descripcion || "",

            periodicidad: rec.Periodicidad || rec.periodicidad || "Único",
            completado: rec.Activo === false

        // PPCL
        if (datosPC.PPCL) {

            if (ppcl.Turbidez) datosPPCL.tabla4.filas = normalizar(ppcl.Turbidez).map(f => ({ semana: f.Semana || "", fecha: f.Fecha || "", turbidez: f.Turbidez || "", medidas: f.Medidas || "", puntoRevisado: f.PuntoRevisado || "", firma: f.Firma || "" }));
            if (ppcl.CloroPh) datosPPCL.tabla5 = normalizar(ppcl.CloroPh).map(f => ({ fecha: f.Fecha || "", cloro: f.Cloro || "", ph: f.Ph || "", medidas: f.Medidas || "", firma: f.Firma || "" }));
            if (ppcl.PurgaMensual) datosPPCL.tabla6.filas = normalizar(ppcl.PurgaMensual).map(f => ({ fecha: f.Fecha || "", observaciones: f.Observaciones || "", medidas: f.Medidas || "", firma: f.Firma || "" }));
            if (ppcl.DepositosAfch) datosPPCL.tabla7.filas = normalizar(ppcl.DepositosAfch).map(f => ({ semana: f.Semana || "", fecha: f.Fecha || "", temperatura: f.Temperatura || "", deposito: f.Deposito || "", medidas: f.Medidas || "", firma: f.Firma || "" }));
            if (ppcl.AcumuladorRetorno) datosPPCL.tabla8 = normalizar(ppcl.AcumuladorRetorno).map(f => ({ fecha: f.Fecha || "", acumulador: f.Acumulador || "", retorno: f.Retorno || "", medidas: f.Medidas || "", firma: f.Firma || "" }));
            if (ppcl.Incendios) datosPPCL.tabla9.filas = normalizar(ppcl.Incendios).map(f => ({ fecha: f.Fecha || "", temperatura: f.Temperatura || "", cloro: f.Cloro || "", ph: f.Ph || "", medidas: f.Medidas || "", firma: f.Firma || "" }));
        }

        guardarTodo();
        actualizarContadores();
        updateStatus("green", "Conectado");
        
    } catch (error) {
        if (error.name !== 'AbortError') {
            updateStatus("red", "Error");
        }
    } finally {
        sincronizando = false;
    }
}

function iniciarAutoSync() {
    if (intervaloAutoSync) return;
    intervaloAutoSync = setInterval(() => {
        if (!sincronizando && SYNC_URL && document.visibilityState === 'visible') {
            autoSyncCompleto();
        }
    }, 2000);
    sincronizacionAutomaticaActiva = true;
}

function detenerAutoSync() {
    if (intervaloAutoSync) {
        clearInterval(intervaloAutoSync);
        intervaloAutoSync = null;
    }
    sincronizacionAutomaticaActiva = false;
}

setInterval(() => {
    const label = document.getElementById("statusLabel");
    if (label) {
        const conectado = label.innerText.includes("Conectado") || label.innerText.includes("PC encontrado");
        if (conectado && !sincronizacionAutomaticaActiva && SYNC_URL) {
            iniciarAutoSync();
        } else if (!conectado && sincronizacionAutomaticaActiva) {
            detenerAutoSync();
        }
    }
}, 10000);

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        detenerAutoSync();
    } else if (SYNC_URL) {
        autoSyncCompleto();
        iniciarAutoSync();
    }
});
